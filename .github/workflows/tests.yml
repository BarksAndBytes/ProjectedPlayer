name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: FFmpeg and a third-party DLNA control point
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -hide_banner -encoders | grep libtheora
          pip install async-upnp-client

      - name: Sender, receiver and DLNA tests
        run: python -m unittest -v tests/test_sender.py tests/test_receiver.py tests/test_dlna.py tests/test_dlna_client.py 2>&1 | tee tests.log; test ${PIPESTATUS[0]} -eq 0

      - name: No DLNA test was skipped
        run: |
          if grep -E "tests\.test_dlna(_client)?\..*\.\.\. skipped" tests.log; then
            echo "::error::a DLNA test was skipped in CI"; exit 1
          fi

      - name: Every script compiles
        run: |
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" import.log; then
            echo "::error::a GDScript file does not compile"; exit 1
          fi
